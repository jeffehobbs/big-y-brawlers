<style>
  html,body{
    margin:0;padding:0;background:#0d0d10;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-family:monospace;
  }
  #wrap{ position:relative; line-height:0; }
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
    box-shadow:0 0 0 4px #c40d3c, 0 0 0 8px #121212, 0 18px 60px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="512"></canvas></div>
<script>
(function(){
  function fit(){
    var c = document.getElementById("game");
    var k = Math.min(window.innerWidth * 0.97 / 800, window.innerHeight * 0.97 / 512);
    c.style.width = Math.floor(800 * k) + "px"; c.style.height = Math.floor(512 * k) + "px";
  }
  window.addEventListener("resize", fit); window.addEventListener("DOMContentLoaded", fit); fit();
})();
</script>
