<style>
  html,body{
    margin:0;padding:0;background:#0d0d10;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-family:monospace;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap{ position:relative; line-height:0; }
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
    box-shadow:0 0 0 4px #c40d3c, 0 0 0 8px #121212, 0 18px 60px rgba(0,0,0,.8);
    touch-action:none;
  }
  /* ---- touch controls (created by js/main.js on touch devices) ---- */
  .tc{ position:fixed; z-index:5; display:none; touch-action:none; -webkit-user-select:none; user-select:none; }
  .tc.on{ display:flex; }
  #stick{
    left:calc(10px + env(safe-area-inset-left)); bottom:calc(14px + env(safe-area-inset-bottom));
    width:112px; height:112px; border-radius:50%;
    background:rgba(18,18,18,.55); border:3px solid rgba(196,13,60,.75);
    align-items:center; justify-content:center;
  }
  #knob{ width:48px; height:48px; border-radius:50%; background:rgba(255,215,0,.8); border:3px solid #8a6a00; pointer-events:none; }
  .tbtn{
    border-radius:50%; background:rgba(18,18,18,.6); border:3px solid rgba(196,13,60,.8);
    color:#fff; font:bold 22px monospace; align-items:center; justify-content:center;
  }
  .tbtn:active, .tbtn.down{ background:rgba(196,13,60,.8); }
  #btnA{ right:calc(14px + env(safe-area-inset-right)); bottom:calc(20px + env(safe-area-inset-bottom)); width:84px; height:84px; font-size:30px; background:rgba(196,13,60,.55); }
  #btnBag{ right:calc(26px + env(safe-area-inset-right)); bottom:calc(116px + env(safe-area-inset-bottom)); width:58px; height:58px; font-size:14px; }
  #btnPause{ right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); width:48px; height:48px; font-size:20px; }
  #rotate{
    position:fixed; inset:0; z-index:20; background:#0d0d10; color:#ffd700; display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center;
    font:bold 20px monospace; letter-spacing:1px; line-height:1.6; padding:24px;
  }
  #rotate .ph{ font-size:64px; display:block; animation:rot 2.2s ease-in-out infinite; }
  @keyframes rot{ 0%,20%{ transform:rotate(0) } 60%,100%{ transform:rotate(-90deg) } }
  @media (orientation:portrait) and (pointer:coarse){ #rotate{ display:flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="512"></canvas></div>
<div id="rotate"><span class="ph">&#128241;</span>ROTATE YOUR PHONE<br/>BIG Y BRAWLERS PLAYS SIDEWAYS</div>
<script>
(function(){
  function fit(){
    var c = document.getElementById("game");
    var k = Math.min(window.innerWidth * 0.97 / 800, window.innerHeight * 0.97 / 512);
    c.style.width = Math.floor(800 * k) + "px"; c.style.height = Math.floor(512 * k) + "px";
  }
  window.addEventListener("resize", fit); window.addEventListener("DOMContentLoaded", fit); fit();
})();
</script>
<script src="js/font.js?v=10"></script>

<script src="js/render.js?v=10"></script>
<script src="js/game.js?v=10"></script>
<script src="js/main.js?v=10"></script>
</body>
